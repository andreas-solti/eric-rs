[package]
name = "eric-sdk"
version = "0.5.0"
authors = ["quambene <contact.quambene@gmail.com>"]
edition = "2021"
readme = "README.md"
license = "Apache-2.0"
homepage = "https://github.com/andreas-solti/eric-rs"
repository = "https://github.com/andreas-solti/eric-rs"
description = "Rust SDK for the ELSTER Rich Client (ERiC)"
documentation = "https://docs.rs/eric-sdk"
keywords = ["eric", "sdk", "taxes", "accounting"]
categories = ["finance"]

[lib]
path = "src/lib.rs"
name = "eric_sdk"

[package.metadata.docs.rs]
features = ["docs-rs"]

[features]
default = []
# This feature is used to run external tests that connect to the Elster servers.
external-test = []
# Generate FFI bindings at build time via bindgen (requires libclang).
# Use this on platforms without pre-generated bindings.
generate-bindings = ["eric-bindings/generate-bindings"]
# This feature is used in CI pipeline for unit tests.
no-linking = ["eric-bindings/no-linking"]
# This feature is used to publish the documentation for `eric-sdk`.
docs-rs = ["eric-bindings/docs-rs"]

[dependencies]
eric-bindings = { version = "0.5.0" }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
roxmltree = "0.20.0"
